name: Discord PR Notification

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send PR notification to Discord
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "🔀 **New Pull Request!**\n\n**${{ github.event.pull_request.title }}**\nOpened by: `${{ github.event.pull_request.user.login }}`\n\n${{ github.event.pull_request.html_url }}"
          }' \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
